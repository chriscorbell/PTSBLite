name: Release

# Semantic-versioned releases: push a tag like v1.2.3 to build all platforms
# and upload them to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package version to tag
        shell: bash
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm run build

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Package & publish
        shell: bash
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    # Runs once after all platform builds finish (the release exists by now).
    # electron-builder leaves the body empty, so we fill it with GitHub's
    # auto-generated notes — PRs/commits since the previous tag.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Generate release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # GitHub builds the changelog from merged PRs / commits since the
          # previous tag (which it auto-detects) and returns it as markdown.
          notes_file="$(mktemp)"
          gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="${TAG_NAME}" \
            --jq '.body' > "${notes_file}"

          gh release edit "${TAG_NAME}" --notes-file "${notes_file}"

  cleanup-release-assets:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Prune release assets to installers + update feed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          keep_assets=(
            "PTSBuilder-${version}-linux-x86_64.AppImage"
            "PTSBuilder-${version}-linux-arm64.AppImage"
            "PTSBuilder-${version}-linux-x86_64.flatpak"
            "PTSBuilder-${version}-linux-aarch64.flatpak"
            "PTSBuilder-${version}-mac-universal.dmg"
            "PTSBuilder-${version}-mac-universal.zip"
            "PTSBuilder-${version}-win-x64.exe"
            "PTSBuilder-${version}-win-arm64.exe"
          )

          gh release view "${TAG_NAME}" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              keep=false
              for keep_asset in "${keep_assets[@]}"; do
                if [[ "${asset}" == "${keep_asset}" ]]; then
                  keep=true
                  break
                fi
              done

              # electron-updater's feed: version manifests (latest*.yml) and the
              # block maps used for differential downloads. Required for in-app
              # auto-update — must not be pruned.
              case "${asset}" in
                latest*.yml|*.blockmap) keep=true ;;
              esac

              if [[ "${keep}" == "true" ]]; then
                continue
              fi

              gh release delete-asset "${TAG_NAME}" "${asset}" --yes
            done
