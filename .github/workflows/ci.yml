name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # Both products build. The Lite build additionally fails if any commercial
      # or Electron module reaches its bundle — see vite.config.ts and ADR-0011.
      - name: Build PTSBuilderLite (web)
        run: pnpm exec vite build

      # PTSBuilder's desktop artifacts are not published at present, so this
      # step is the only thing keeping the Electron target compiling.
      - name: Build PTSBuilder (electron)
        run: pnpm exec electron-vite build
