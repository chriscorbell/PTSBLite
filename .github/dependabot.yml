version: 2

# Bun has no equivalent of pnpm's minimum-release-age guard, which this project
# relied on until the move to Bun and which demonstrably blocked a Dependabot PR.
# Nothing here replaces it: `bun audit` catches *known* vulnerabilities rather
# than refusing anything merely new, so the freshly-published-and-compromised
# case is now uncovered. Reviewing what a Dependabot PR actually bumps matters
# more than it did. See ADR-0008.

updates:
  # The repo may sit idle for months while client requirements are pending.
  # Grouping keeps that from returning as a wall of individual PRs, while
  # majors stay separate because they are the ones that need judgement —
  # several are deliberately held (see the README and the hardening plan).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Held: typescript-eslint supports TypeScript <6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Held: stable electron-vite 5 supports Vite only through 7, and
      # @vitejs/plugin-react 6 requires Vite 8.
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      # Held: tracks the Node runtime bundled by Electron, not the latest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Actions are grouped without splitting majors, unlike npm above. An Actions
  # major is usually a runner or Node bump rather than an API change, and they
  # need to move together: the runner deprecates old Node versions on its own
  # schedule, so a workflow left behind starts emitting deprecation warnings and
  # eventually stops running. Splitting them would mean three PRs to fix one
  # deprecation.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
