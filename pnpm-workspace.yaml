allowBuilds:
  electron: true
  esbuild: true
  # We package Windows with NSIS, not Squirrel.Windows, so electron-winstaller
  # never runs and its build script is intentionally not approved.
  electron-winstaller: false

overrides:
  # electron-updater declares ^4.1.0 and resolves js-yaml 4.1.1, which carries a
  # high-severity quadratic-complexity DoS advisory. 4.3.0 is inside that range
  # and outside the advisory, so this forces what the range already allowed
  # rather than pushing electron-updater somewhere it did not agree to go.
  #
  # It matters because js-yaml ships: electron-updater parses the latest*.yml
  # update feed fetched from GitHub, which is remote input. See #84.
  #
  # That reachability argument is dormant while desktop releases are paused —
  # nothing publishes a feed, so nothing fetches one. The pin stays anyway: it
  # costs nothing, and it has to be right again the moment .github/workflows/
  # release.yml is taken off manual dispatch.
  js-yaml: ^4.3.0
  #
  # Deliberately NOT overridden: brace-expansion. `pnpm audit` reports one high
  # advisory against it, and it is expected to stay. Only the 5.x line was
  # patched; the 1.x and 2.x copies reach us through minimatch 3/5/9, deep
  # inside electron-builder, and forcing 5.x on them is a major-version jump
  # their ranges never allowed — into the code that packs the asar and builds
  # the signed installers.
  #
  # It is also not reachable here. The advisory is a DoS on a crafted glob
  # pattern, and every glob this project expands is one we wrote ourselves in
  # electron-builder.yml. Nothing an attacker controls reaches it. Revisit when
  # electron-builder moves to minimatch 10, not before.
