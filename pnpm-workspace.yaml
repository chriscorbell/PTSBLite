allowBuilds:
  electron: true
  esbuild: true
  # We package Windows with NSIS, not Squirrel.Windows, so electron-winstaller
  # never runs and its build script is intentionally not approved.
  electron-winstaller: false

overrides:
  # electron-updater declares ^4.1.0 and resolves js-yaml 4.1.1, which carries a
  # high-severity quadratic-complexity DoS advisory. 4.3.0 is inside that range
  # and outside the advisory, so this forces what the range already allowed
  # rather than pushing electron-updater somewhere it did not agree to go.
  #
  # It matters because js-yaml ships: electron-updater parses the latest*.yml
  # update feed fetched from GitHub, which is remote input. See #84.
  #
  # That reachability argument is dormant while desktop releases are paused —
  # nothing publishes a feed, so nothing fetches one. The pin stays anyway: it
  # costs nothing, and it has to be right again the moment .github/workflows/
  # release.yml is taken off manual dispatch.
  js-yaml: ^4.3.0
  #
  # Deliberately NOT overridden: brace-expansion. This was a standing high
  # advisory for months and is now resolved without an override, which is why
  # the entry stays as a record rather than being deleted.
  #
  # The reasoning was: only the 5.x line had been patched, and the 1.x and 2.x
  # copies reach us through minimatch 3/5/9 deep inside electron-builder, so
  # forcing 5.x on them would have been a major-version jump their ranges never
  # allowed — into the code that packs the asar and builds the signed
  # installers. It was also not reachable: the advisory is a DoS on a crafted
  # glob pattern, and every glob this project expands is one we wrote ourselves
  # in electron-builder.yml.
  #
  # Upstream backported the fix. 1.1.18 and 2.1.4 are both past the patched
  # thresholds, and a routine lockfile refresh picked them up. Waiting cost
  # nothing and an override would have had to be unpicked.
