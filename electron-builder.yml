appId: com.ptsbuilder.app
productName: PTSBuilder
copyright: © 2026 Chris Corbell

directories:
  # build/ holds the source icons (icon.icns / icon.ico / icon.png), which
  # electron-builder auto-detects per platform. Installers land in release/.
  buildResources: build
  output: release

# electron-vite bundles everything into out/, so the packaged app only needs the
# build output, the manifest, and the runtime icons referenced by main.ts.
files:
  - out/**/*
  - package.json
  - build/icon.png
  - build/icon.ico
  # Apache-2.0 section 4 requires recipients of a distribution to get a copy of
  # the license and the NOTICE file. Shipping the installers is a distribution.
  - LICENSE
  - NOTICE
  # Vite writes CJS-interop shims into node_modules while building and does not
  # always clean them up. They are inert, but they made the packaged output
  # depend on whether a build happened to leave one behind — an installer should
  # contain what we intend and nothing else, especially a signed one.
  - "!**/*_vite_proxy.tmp.*"

asar: true
# No native modules — skip the rebuild step (faster, no node-gyp toolchain needed).
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Signed with a Developer ID and notarized. Squirrel.Mac refuses to apply an
  # update whose signature it cannot verify, so this is what makes macOS
  # self-update possible at all — see ADR-0006. Credentials come from the
  # release workflow; there is nothing to configure for a local build, which
  # simply produces an unsigned app.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    # The zip is not a convenience download: electron-updater fetches it to
    # apply macOS updates. The dmg is what a human downloads. Both are required.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  # One-click, per-user installer: no install-mode prompt ("only for me" vs
  # "everyone"), no directory page, no elevation. Installs to
  # %LOCALAPPDATA%\Programs\PTSBuilder, which lets in-app updates apply silently
  # and unattended (see the quitAndInstall call in electron/main.ts).
  oneClick: true
  perMachine: false
  buildUniversalInstaller: false

linux:
  icon: build/icon.png
  category: Graphics
  maintainer: Chris Corbell <hi@chriscorbell.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: flatpak
      arch: [x64, arm64]

flatpak:
  runtimeVersion: "25.08"
  baseVersion: "25.08"

publish:
  provider: github
  owner: chriscorbell
  repo: PTSBuilder
  releaseType: release
